AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31

Parameters:
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1a
  DynamodbPrefixListID:
    Type: String
  DevUserArn:
    Type: String



Resources:
  # Network
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      Tags:
        - Key: Project
          Value: GameHosting
        - Key: Name
          Value: GameHostingVPC

  # Public subnet
  VPCPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Ref AvailabilityZone
      Tags:
        - Key: Project
          Value: GameHosting
        - Key: Name
          Value: GameHostingPublicSubnet

  VPCPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Project
          Value: GameHosting
        - Key: Name
          Value: GameHostingPublicRouteTable

  VPCPublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref VPCPublicRouteTable
      SubnetId: !Ref VPCPublicSubnet

  VPCInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Project
          Value: GameHosting

  VPCInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref VPCInternetGateway
      VpcId: !Ref VPC

  VPCRouteInternetGateway:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref VPCPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref VPCInternetGateway

  # Private subnet
  VPCPrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Ref AvailabilityZone
      Tags:
        - Key: Project
          Value: GameHosting
        - Key: Name
          Value: GameHostingPrivateSubnet

  VPCPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Project
          Value: GameHosting
        - Key: Name
          Value: GameHostingPrivateRouteTable

  VPCPrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref VPCPrivateRouteTable
      SubnetId: !Ref VPCPrivateSubnet

  # Server
  WebsiteServer:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      ImageId: ami-022bbd2ccaf21691f
      InstanceType: t4g.medium
      KeyName: !Ref WebsiteServerKeyPair
      SecurityGroupIds:
        - !Ref WebsiteServerSecurityGroup
      SubnetId: !Ref VPCPublicSubnet
      Tags:
        - Key: Project
          Value: GameHosting
        - Key: Name
          Value: GameHostingWebsiteServerKeyPair

  WebsiteServerKeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: GameHostingWebsiteServerKeyPair
      KeyFormat: pem
      KeyType: ed25519
      Tags:
        - Key: Project
          Value: GameHosting

  WebsiteServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: AllowHTTPSTraffic
      GroupDescription: Allows HTTP (port 80) and HTTPS (port 443) traffic
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - CidrIp: 0.0.0.0/0
          FromPort: 80
          ToPort: 80
          IpProtocol: tcp
          Description: HTTP Traffic
        - CidrIp: 0.0.0.0/0
          FromPort: 443
          ToPort: 443
          IpProtocol: tcp
          Description: HTTPS Traffic
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: "-1"
          Description: All Outbound Traffic
      Tags:
        - Key: Project
          Value: GameHosting

  WebsiteServerRoleForFunctions:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "GameHostingWebsiteServerRoleForFunctions"
      Description: "Role for Game Hosting website to invoke lambda functions"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
              AWS:
                - !Ref DevUserArn
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: "GameHostingWebsiteServerRolePolicyForFunctions"
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt LoginFunction.Arn
                  - !GetAtt CreateLoginFunction.Arn
        

  # Endpoint for Login Table
  LoginTableVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      RouteTableIds:
        - !Ref VPCPrivateRouteTable
      ServiceName: com.amazonaws.us-east-1.dynamodb
      VpcEndpointType: Gateway
      VpcId: !Ref VPC
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: "*"
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:DeleteItem
              - dynamodb:UpdateItem
            Resource:
              - !GetAtt LoginTable.Arn


  LoginFunctionVPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: AllowOutboundToLoginTable
      GroupDescription: Allows outbound traffic to login table VPC endpoint
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationPrefixListId: !Ref DynamodbPrefixListID
      VpcId: !Ref VPC
      Tags:
        - Key: Project
          Value: GameHosting

  # Functions
  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: "LoginToGameHostingWebsite"
      Description: "Function that queries LoginTable to check if login credentials are valid"
      CodeUri: login/
      Handler: app.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      Role: !GetAtt LoginFunctionRole.Arn
      VpcConfig:
        SubnetIds:
          - !Ref VPCPrivateSubnet
        SecurityGroupIds:
          - !Ref LoginFunctionVPCEndpointSecurityGroup
      Tags:
        Project: "GameHosting"

  CreateLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: "CreateLoginForGameHostingWebsite"
      Description: "Function that creates a login in LoginTable if username is unique"
      CodeUri: createlogin/
      Handler: app.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      Role: !GetAtt LoginFunctionRole.Arn
      VpcConfig:
        SubnetIds:
          - !Ref VPCPrivateSubnet
        SecurityGroupIds:
          - !Ref LoginFunctionVPCEndpointSecurityGroup
      Tags:
        Project: "GameHosting"

  LoginFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "GameHostingLoginFunctionRole"
      Description: "Role for login and create login functions to grant permissions for LoginTable"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: "GameHostingLoginFunctionRolePolicy"
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: 
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt LoginTable.Arn
                  - !Sub "${LoginTable.Arn}/*"
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                Resource: "*"
      Tags:
        - Key: "Project"
          Value: "GameHosting"

  # Database
  LoginTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      TableName: GameHostingLoginTable
      AttributeDefinitions:
        - AttributeName: Username
          AttributeType: S
      KeySchema:
        - AttributeName: Username
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: GameHosting

  # ECS
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: "GameHostingCluster"

  GameServerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: '2048'
      Memory: '8192'
      NetworkMode: awsvpc
      # ExecutionRoleArn: # TODO: Define execution role
      ContainerDefinitions:
      - Image: itzg/minecraft-server:latest
        Name: ServerContainer
        Essential: true
        MountPoints:
        - ContainerPath: /data
          SourceVolume: ServerVolume
        PortMappings:
        - Name: papertesthameportmapping
          ContainerPort: 25565
          Protocol: tcp
        # LogConfiguration:
        #   LogDriver: awslogs
        #   Options:
        #     mode: non-blocking
        #     awslogs-group: /ecs/server-task-definition
        #     awslogs-region: us-east-1
        #     awslogs-stream-prefix: ecs
        Environment:
        - Name: EULA
          Value: 'TRUE'
        - Name: TYPE
          Value: PAPER
      Volumes:
      - Name: ServerVolume
        Host:
          SourcePath: /server
        ConfiguredAtLaunch: false

  GameServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: "GameServerSecurityGroup"
      GroupDescription: "Security group for user minecraft server to accept only game-specific traffic"
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: "tcp"
          FromPort: 25565
          ToPort: 25565
      SecurityGroupIngress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: "tcp"
          FromPort: 25565
          ToPort: 25565
      Tags:
        - Key: Project
          Value: GameHosting
      VpcId: !Ref VPC



Outputs:
  GameHostingVPC:
    Description: "ID of the GameHosting VPC"
    Value: !Ref VPC

  GameHostingPublicSubnet:
    Description: "ID of the GameHosting Public Subnet"
    Value: !Ref VPCPublicSubnet

  GameHostingPrivateSubnet:
    Description: "ID of the GameHosting Private Subnet"
    Value: !Ref VPCPrivateSubnet

  GameHostingCluster:
    Description: "ARN of the GameHosting ECS Cluster"
    Value: !GetAtt Cluster.Arn

  GameHostingGameServerTaskDefinition:
    Description: "ARN of the GameHosting Game Server Task Definition"
    Value: !Ref GameServerTaskDefinition

  GameHostingGameServerSecurityGroup:
    Description: "ID of the GameHosting Game Server Security Group"
    Value: !Ref GameServerSecurityGroup